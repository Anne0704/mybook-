<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的小帳本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F3F8; --surface:#FFFFFF; --ink:#23213A; --muted:#757290; --line:#E3E1EE;
  --accent:#4B3FD1; --accent-ink:#FFFFFF; --soft:#ECEAF8;
  --income:#12805F; --expense:#D2453D; --warn-bg:#FCE9E7; --ok-bg:#E0F3EC;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14131F; --surface:#1E1C2D; --ink:#EDEBFA; --muted:#9B98B5; --line:#2E2B44;
    --accent:#8F85FF; --accent-ink:#14131F; --soft:#272440;
    --income:#4FD1A5; --expense:#FF7B72; --warn-bg:#3A2024; --ok-bg:#16322A;
  }
}
:root[data-theme="dark"]{
  --bg:#14131F; --surface:#1E1C2D; --ink:#EDEBFA; --muted:#9B98B5; --line:#2E2B44;
  --accent:#8F85FF; --accent-ink:#14131F; --soft:#272440;
  --income:#4FD1A5; --expense:#FF7B72; --warn-bg:#3A2024; --ok-bg:#16322A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
#app{max-width:560px;margin:0 auto;padding:0 16px 150px}
.num{font-variant-numeric:tabular-nums}
.neg{color:var(--expense)} .pos{color:var(--income)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px}
.top h1{margin:0;font-size:24px;font-weight:900;letter-spacing:.02em}
.ghost{font-size:13px;color:var(--muted);padding:6px 12px;border:1px solid var(--line);border-radius:99px}

/* wishlist */
.sumline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:2px 0 12px;color:var(--muted);font-size:14px}
.sumline b{color:var(--ink);font-size:26px;font-weight:900}
.afford{background:var(--soft);border-radius:14px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.afford b{font-weight:900}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -16px 14px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 15px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:14px;color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:500}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
.ph{aspect-ratio:1/1;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:900;font-size:28px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.tag{font-size:12px;color:var(--muted)}
.cb h3{margin:0;font-size:15px;font-weight:500;line-height:1.35;word-break:break-word}
.pr{font-weight:900;font-size:17px;margin-top:2px}
.ca{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px;gap:6px}
.ca a{font-size:13px;color:var(--accent);text-decoration:underline;text-underline-offset:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.buy{margin-left:auto;font-size:13px;padding:5px 12px;border-radius:99px;border:1px solid var(--accent);color:var(--accent);flex:none}
.card.done .ph,.card.done .cb h3,.card.done .pr{opacity:.45}
.card.done .cb h3{text-decoration:line-through}
.card.done .buy{background:var(--accent);color:var(--accent-ink)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:56px 12px;border:1.5px dashed var(--line);border-radius:18px}

/* money */
.nav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.nav b{font-size:17px;font-weight:700}
.nav button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
.hero{background:var(--ink);color:var(--bg);border-radius:24px;padding:20px 20px 18px;margin-bottom:12px}
.hero .lbl{margin:0;font-size:13px;opacity:.7}
.hero .big{font-size:44px;font-weight:900;line-height:1.15;letter-spacing:-.01em;margin-bottom:10px}
.hero .big.bad{color:#FF9A93}
.frow{display:flex;justify-content:space-between;font-size:14px;opacity:.9;padding:3px 0}
.frow.sum{opacity:1;font-weight:700}
.cum{margin-top:12px;padding-top:12px;border-top:1px solid rgba(128,128,150,.4);display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cum span{font-size:14px}
.cum b{font-size:24px;font-weight:900}
.cum b.bad{color:#FF9A93}
.set{margin-top:12px;font-size:13px;border:1px solid rgba(128,128,150,.55);padding:6px 14px;border-radius:99px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.sec h3{margin:0;font-size:14px;font-weight:500;color:var(--muted)}
.sec .v{font-size:30px;font-weight:900;line-height:1.25}
.sec .sub{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;margin-top:3px;gap:8px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.duo .sec{margin:0}
.duo .v{font-size:22px}
.mg{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.mg:first-of-type{margin-top:8px}
.mg span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mg small{color:var(--muted);margin-right:6px;font-size:12px}
.mg b{font-weight:700}
.week{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 14px 6px;margin-bottom:12px}
.wh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
.wh b{font-size:16px;font-weight:700}
.wh small{display:block;color:var(--muted);font-size:12px}
.all{font-size:13px;padding:5px 11px;border-radius:99px;background:var(--soft);color:var(--accent);font-weight:500;white-space:nowrap}
.wd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 6px;font-size:13px;color:var(--muted)}
.pill{font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill.over{background:var(--warn-bg);color:var(--expense)}
.pill.ok{background:var(--ok-bg);color:var(--income)}
.pill.mute{background:var(--soft);color:var(--muted);font-weight:500}
.day{display:grid;grid-template-columns:28px 1fr auto 32px;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.day input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);margin:0}
.dn b{font-weight:500;font-size:14px}
.dn small{display:block;font-size:12px;color:var(--muted);line-height:1.35}
.day.off .dn b{color:var(--muted)}
.plus{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);color:var(--muted);font-size:16px;line-height:1}
.tx{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:5px 0 7px 36px}
.tx .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.tx .n small{color:var(--muted);margin-left:6px;font-size:12px}
.tx .x{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--soft);color:var(--accent);margin-left:6px}
.tx .a{font-weight:700;font-size:14px}
.a.in{color:var(--income)} .a.out{color:var(--expense)}

/* nav + fab */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs div{display:flex;gap:8px;width:100%;max-width:560px}
.tabs button{flex:1;padding:11px 0;border-radius:14px;font-weight:500;color:var(--muted)}
.tabs button.on{background:var(--soft);color:var(--accent);font-weight:700}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:14px 22px;border-radius:99px;box-shadow:0 6px 20px rgba(40,30,120,.3)}

/* sheet */
#backdrop{position:fixed;inset:0;z-index:20;background:rgba(20,18,40,.5);opacity:0;pointer-events:none;transition:opacity .2s}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;margin:0 auto;max-width:560px;max-height:90%;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s ease}
body.sheet-open #backdrop{opacity:1;pointer-events:auto}
body.sheet-open #sheet{transform:none}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sh h2{margin:0;font-size:19px}
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.in,.fld input[type=text],.fld input[type=url],.fld input[type=number],.fld input[type=date],.fld select,.fld textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--bg);outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts label{cursor:pointer}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts span{display:inline-block;padding:8px 16px;border-radius:99px;border:1px solid var(--line);color:var(--muted);font-size:14px}
.opts input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.opts input:focus-visible+span,button:focus-visible,a:focus-visible,.day input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.photo{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.photo .pv{width:92px;height:92px;border-radius:16px;background:var(--soft);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;flex:none;text-align:center}
.photo .pv img{width:100%;height:100%;object-fit:cover}
.photo input{display:none}
.btn{padding:12px 20px;border-radius:14px;font-weight:700;border:1px solid var(--line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1}
.btn.danger{color:var(--expense)}
.btns{display:flex;gap:10px;margin-top:6px}
.sw{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;cursor:pointer;background:var(--bg)}
.sw small{display:block;color:var(--muted);font-size:12px}
.sw input{width:22px;height:22px;accent-color:var(--accent)}
.hint{font-size:13px;color:var(--muted);margin:0 0 12px}
#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:30;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;display:flex;gap:14px;align-items:center;max-width:90%;transition:.2s}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:#9D95FF;font-weight:700;white-space:nowrap}
@media (prefers-reduced-motion: reduce){#sheet,#backdrop,#toast{transition:none}}
</style>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小帳本">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#4B3FD1">
</head>
<body>
<div id="app"></div>
<div id="backdrop" data-a="closeSheet"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast"></div>

<script>
(function(){
var KEY='wishbook.v1';
var CATS=['衣服','包包','飾品','鞋子','其他'];
var EXP=['飲食','必需用品','購物','娛樂','其他'];
var INC=['打工','獎學金','紅包獎金','其他'];
var MIGRATE={'日用':'必需用品','交通':'必需用品','學業':'必需用品','生活費':'其他'};
var S={items:[],tx:[],pay:{},allow:{},rate:400};

function load(){
  try{
    var r=localStorage.getItem(KEY);
    if(r){
      var d=JSON.parse(r);
      S.items=d.items||[];S.tx=d.tx||[];S.pay=d.pay||{};S.allow=d.allow||{};S.rate=d.rate||400;
      S.tx.forEach(function(t){if(MIGRATE[t.cat])t.cat=MIGRATE[t.cat];});
    }
  }catch(e){}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));return true;}
  catch(e){toast('儲存空間不足，請刪掉一些照片或做備份');return false;}
}
load();

function pad(n){return String(n).padStart(2,'0');}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function dimOf(ym){var p=ym.split('-');return new Date(+p[0],+p[1],0).getDate();}
function shiftMonth(ym,k){var p=ym.split('-');var d=new Date(+p[0],+p[1]-1+k,1);return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function monthLabel(ym){var p=ym.split('-');return p[0]+'年'+(+p[1])+'月';}
function money(n){var v=Math.round(n||0);return (v<0?'-':'')+'$'+Math.abs(v).toLocaleString('zh-TW');}
function sgn(n){return (n<0?'−':'+')+money(Math.abs(n));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function normLink(u){u=(u||'').trim();if(!u)return '';if(!/^https?:\/\//i.test(u))u='https://'+u;return u;}
function host(u){try{return new URL(u).hostname.replace(/^www\./,'');}catch(e){return '商品連結';}}
function $(s){return document.querySelector(s);}
var WD=['日','一','二','三','四','五','六'];
function wdOf(ds){return WD[new Date(+ds.slice(0,4),+ds.slice(5,7)-1,+ds.slice(8)).getDay()];}

var ui={tab:'wish',cat:'全部',month:todayStr().slice(0,7),draft:null};

/* ---------- calculations ---------- */
function allowOf(ym){
  var best='';
  Object.keys(S.allow).forEach(function(k){if(k<=ym&&k>best)best=k;});
  return best?(+S.allow[best]||0):0;
}
function sumOf(list){return list.reduce(function(a,t){return a+t.amount;},0);}
function statsOf(ym){
  var dim=dimOf(ym),today=todayStr(),rate=S.rate||400;
  var txs=S.tx.filter(function(t){return t.date.slice(0,7)===ym;});
  var meal={};
  txs.forEach(function(t){if(t.type==='expense'&&t.cat==='飲食')meal[t.date]=(meal[t.date]||0)+t.amount;});
  var days=0,saved=0,d,ds;
  for(d=1;d<=dim;d++){
    ds=ym+'-'+pad(d);
    if(S.pay[ds])days++;
    if(ds<today)saved+=(S.pay[ds]?rate:0)-(meal[ds]||0);
  }
  var incs=txs.filter(function(t){return t.type==='income';});
  var exps=txs.filter(function(t){return t.type==='expense';});
  var inc=sumOf(incs),incExtra=sumOf(incs.filter(function(t){return t.extra;}));
  var exp=sumOf(exps),mealTot=sumOf(exps.filter(function(t){return t.cat==='飲食';}));
  var other=exp-mealTot;
  var magic=exps.filter(function(t){return t.cat!=='飲食'&&t.cat!=='必需用品';}).sort(function(a,b){return b.amount-a.amount;});
  var allow=allowOf(ym),planned=days*rate,bonus=saved+incExtra;
  return {txs:txs,meal:meal,days:days,saved:saved,inc:inc,incExtra:incExtra,exp:exp,mealTot:mealTot,other:other,
    magic:magic,magicTot:sumOf(magic),allow:allow,planned:planned,bonus:bonus,avail:allow-planned-other+bonus,rate:rate};
}
function firstMonth(){
  var m=Object.keys(S.allow);
  S.tx.forEach(function(t){m.push(t.date.slice(0,7));});
  Object.keys(S.pay).forEach(function(k){m.push(k.slice(0,7));});
  m.sort();return m[0]||null;
}
function cumOf(ym){
  var f=firstMonth();
  if(!f||f>ym)return 0;
  var t=0,c=f;
  while(c<=ym){t+=statsOf(c).avail;c=shiftMonth(c,1);}
  return t;
}

/* ---------- views ---------- */
function viewWish(){
  var items=S.items.slice().sort(function(a,b){return ((a.bought?1:0)-(b.bought?1:0))||(b.created-a.created);});
  var list=ui.cat==='全部'?items:items.filter(function(i){return i.cat===ui.cat;});
  var open=S.items.filter(function(i){return !i.bought;});
  var total=open.reduce(function(s,i){return s+(+i.price||0);},0);
  var h='<div class="sumline"><span>還想買 '+open.length+' 件，合計</span><b class="num">'+money(total)+'</b></div>';
  if(firstMonth()){
    var cum=cumOf(todayStr().slice(0,7));
    var t='累計可用餘額 <b class="num">'+money(cum)+'</b>';
    if(total>0)t+=(cum>=total?'，全部買完還剩 <b class="num pos">'+money(cum-total)+'</b>':'，全部買完還差 <b class="num neg">'+money(total-cum)+'</b>');
    h+='<div class="afford">'+t+'</div>';
  }
  h+='<div class="chips">'+['全部'].concat(CATS).map(function(c){
    return '<button class="chip'+(ui.cat===c?' on':'')+'" data-a="cat" data-v="'+c+'">'+c+'</button>';
  }).join('')+'</div>';
  h+='<div class="grid">';
  if(!list.length){
    h+='<div class="empty">'+(S.items.length?'這個分類還沒有東西':'還沒有想買的東西<br>按右下角「新增」開始記錄')+'</div>';
  }
  list.forEach(function(i){
    h+='<article class="card'+(i.bought?' done':'')+'" data-a="editItem" data-id="'+i.id+'">'+
      '<div class="ph">'+(i.photo?'<img alt="" src="'+i.photo+'">':esc(i.cat))+'</div>'+
      '<div class="cb"><span class="tag">'+esc(i.cat)+'</span><h3>'+esc(i.name)+'</h3>'+
      '<div class="pr num">'+(i.price?money(i.price):'未填價格')+'</div>'+
      '<div class="ca">'+(i.link?'<a href="'+esc(i.link)+'" target="_blank" rel="noopener noreferrer">'+esc(host(i.link))+'</a>':'')+
      '<button class="buy" data-a="toggleBought" data-id="'+i.id+'">'+(i.bought?'已買':'買了')+'</button></div></div></article>';
  });
  h+='</div>';
  return h;
}

function viewMoney(){
  var ym=ui.month,st=statsOf(ym),cum=cumOf(ym),dim=dimOf(ym),nW=dim>28?5:4,today=todayStr(),mo=+ym.slice(5),rate=st.rate;
  var h='<div class="nav"><button data-a="monthPrev" aria-label="上個月">‹</button><b>'+monthLabel(ym)+'</b><button data-a="monthNext" aria-label="下個月">›</button></div>';

  h+='<section class="hero"><p class="lbl">'+mo+'月可用餘額</p><div class="big num'+(st.avail<0?' bad':'')+'">'+money(st.avail)+'</div>'+
    '<div class="frow"><span>生活費</span><span class="num">'+money(st.allow)+'</span></div>'+
    '<div class="frow"><span>預計飯錢（'+st.days+'天 × '+rate+'）</span><span class="num">−'+money(st.planned)+'</span></div>'+
    '<div class="frow"><span>飯錢以外的支出</span><span class="num">−'+money(st.other)+'</span></div>'+
    '<div class="frow"><span>多了錢錢</span><span class="num">'+sgn(st.bonus)+'</span></div>'+
    '<div class="cum"><span>累計可用餘額（到'+mo+'月）</span><b class="num'+(cum<0?' bad':'')+'">'+money(cum)+'</b></div>'+
    '<button class="set" data-a="openSettings">設定生活費與飯錢</button></section>';

  h+='<section class="sec"><h3>多了錢錢</h3><div class="v num '+(st.bonus<0?'neg':'pos')+'">'+money(st.bonus)+'</div>'+
    '<div class="sub"><span>吃飯省下（過完那天才結算）</span><span class="num">'+money(st.saved)+'</span></div>'+
    '<div class="sub"><span>額外收入／獎金</span><span class="num">'+money(st.incExtra)+'</span></div></section>';

  h+='<div class="duo"><section class="sec"><h3>總收入</h3><div class="v num pos">'+money(st.allow+st.inc)+'</div>'+
    '<div class="sub"><span>生活費</span><span class="num">'+money(st.allow)+'</span></div>'+
    '<div class="sub"><span>其他收入</span><span class="num">'+money(st.inc)+'</span></div></section>'+
    '<section class="sec"><h3>總支出</h3><div class="v num neg">'+money(st.exp)+'</div>'+
    '<div class="sub"><span>吃飯</span><span class="num">'+money(st.mealTot)+'</span></div>'+
    '<div class="sub"><span>其他</span><span class="num">'+money(st.other)+'</span></div></section></div>';

  h+='<section class="sec"><h3>神奇花費（不是吃飯、必需用品）</h3><div class="v num">'+money(st.magicTot)+'</div>';
  if(!st.magic.length)h+='<div class="sub"><span>這個月沒有神奇花費</span></div>';
  st.magic.forEach(function(t){
    h+='<div class="mg"><span><small class="num">'+(+t.date.slice(5,7))+'/'+(+t.date.slice(8))+'</small>'+esc(t.note||t.cat)+'</span><b class="num">'+money(t.amount)+'</b></div>';
  });
  h+='</section>';

  for(var w=1;w<=nW;w++){
    var s=(w-1)*7+1,e=w===5?dim:Math.min(w*7,dim),k,ds;
    var tick=0,wsaved=0,anySettled=false,rows='';
    for(var d=s;d<=e;d++){
      ds=ym+'-'+pad(d);
      var tk=!!S.pay[ds],spent=st.meal[ds]||0,settled=ds<today;
      if(tk)tick++;
      var right='',sub;
      if(settled){
        anySettled=true;
        var sv=(tk?rate:0)-spent;wsaved+=sv;
        right=(tk||spent)?'<span class="pill num '+(sv<0?'over':'ok')+'">'+(sv<0?'多花 '+money(-sv):'省 '+money(sv))+'</span>':'<span class="pill mute">不用自付</span>';
      }else if(tk){
        right='<span class="pill mute">'+(ds===today?'今天過完結算':'尚未結算')+'</span>';
      }
      sub=tk?('自付，預計 '+money(rate)):'不用自付';
      if(spent)sub+='，吃了 '+money(spent);
      rows+='<div class="day'+(tk?'':' off')+'"><input type="checkbox" class="paybox" data-d="'+ds+'"'+(tk?' checked':'')+' aria-label="'+(+ym.slice(5))+'/'+d+' 自付飯錢">'+
        '<div class="dn"><b class="num">'+mo+'/'+d+' 週'+wdOf(ds)+'</b><small>'+sub+'</small></div>'+
        '<div>'+right+'</div><button class="plus" data-a="addTxDay" data-d="'+ds+'" aria-label="在'+mo+'/'+d+'記一筆">＋</button></div>';
      st.txs.filter(function(t){return t.date===ds;}).forEach(function(t){
        rows+='<button class="tx" data-a="editTx" data-id="'+t.id+'"><span class="n">'+esc(t.note||t.cat)+(t.note?'<small>'+esc(t.cat)+'</small>':'')+(t.type==='income'&&t.extra?'<span class="x">額外</span>':'')+'</span>'+
          '<span class="a num '+(t.type==='income'?'in':'out')+'">'+(t.type==='income'?'+':'−')+money(t.amount)+'</span></button>';
      });
    }
    h+='<section class="week"><div class="wh"><div><b>第'+w+'週</b><small>'+mo+'/'+s+' – '+mo+'/'+e+'</small></div>'+
      '<button class="all" data-a="weekAll" data-w="'+w+'">全部自付／清除</button></div>'+
      '<div class="wd"><span class="num">自付 '+tick+' 天，預計飯錢 '+money(tick*rate)+'</span>'+
      (anySettled?'<span class="pill num '+(wsaved<0?'over':'ok')+'">'+(wsaved<0?'已結算多花 '+money(-wsaved):'已結算省 '+money(wsaved))+'</span>':'')+'</div>'+
      rows+'</section>';
  }
  return h;
}

function render(){
  var h='<header class="top"><h1>'+(ui.tab==='wish'?'想買的東西':'記帳')+'</h1><button class="ghost" data-a="openBackup">備份</button></header>';
  h+=ui.tab==='wish'?viewWish():viewMoney();
  h+='<button class="fab" data-a="'+(ui.tab==='wish'?'addItem':'addTx')+'">＋ '+(ui.tab==='wish'?'新增':'記一筆')+'</button>';
  h+='<nav class="tabs"><div><button class="'+(ui.tab==='wish'?'on':'')+'" data-a="tab" data-v="wish">願望清單</button><button class="'+(ui.tab==='money'?'on':'')+'" data-a="tab" data-v="money">記帳</button></div></nav>';
  $('#app').innerHTML=h;
}
function rerender(){var y=window.scrollY;render();window.scrollTo(0,y);}

/* ---------- sheet ---------- */
function openSheet(html){$('#sheet').innerHTML=html;document.body.classList.add('sheet-open');$('#sheet').scrollTop=0;}
function closeSheet(){document.body.classList.remove('sheet-open');ui.draft=null;}
function radios(name,list,cur){
  return '<div class="opts">'+list.map(function(c){return '<label><input type="radio" name="'+name+'" value="'+c+'"'+(c===cur?' checked':'')+'><span>'+c+'</span></label>';}).join('')+'</div>';
}

function openItem(id){
  var it=id?S.items.find(function(i){return i.id===id;}):null;
  ui.draft={id:id||null,photo:it?it.photo||'':''};
  openSheet('<div class="sh"><h2>'+(it?'編輯':'新增想買的東西')+'</h2><button class="ghost" data-a="closeSheet">關閉</button></div>'+
    '<div class="photo"><div class="pv" id="pv">'+photoPrev(ui.draft.photo)+'</div><div><label class="btn" style="display:inline-block;cursor:pointer">選擇照片<input type="file" id="photoIn" accept="image/*"></label>'+
    '<button class="ghost" style="margin-left:8px" data-a="rmPhoto">移除</button></div></div>'+
    '<label class="fld"><span>名稱</span><input type="text" id="f_name" placeholder="例如：米色針織外套" value="'+esc(it&&it.name)+'"></label>'+
    '<div class="fld"><span>分類</span>'+radios('cat',CATS,it?it.cat:CATS[0])+'</div>'+
    '<label class="fld"><span>價格</span><input type="number" inputmode="decimal" id="f_price" placeholder="0" value="'+(it&&it.price?it.price:'')+'"></label>'+
    '<label class="fld"><span>商品連結</span><input type="url" id="f_link" placeholder="貼上網址" value="'+esc(it&&it.link)+'"></label>'+
    '<label class="fld"><span>備註</span><input type="text" id="f_note" placeholder="尺寸、顏色、等打折…" value="'+esc(it&&it.note)+'"></label>'+
    '<div class="btns">'+(it?'<button class="btn danger" data-a="delItem">刪除</button>':'')+'<button class="btn primary" data-a="saveItem">儲存</button></div>');
}
function photoPrev(p){return p?'<img alt="" src="'+p+'">':'還沒有<br>照片';}

function readPhoto(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        var m=640,k=Math.min(1,m/Math.max(img.width,img.height));
        var w=Math.round(img.width*k),h=Math.round(img.height*k);
        var c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg',.72));
      };
      img.onerror=rej;img.src=fr.result;
    };
    fr.onerror=rej;fr.readAsDataURL(file);
  });
}

function openTx(id,pre){
  var t=id?S.tx.find(function(x){return x.id===id;}):null;
  pre=pre||{};
  var cur=t||{type:pre.type||'expense',amount:pre.amount||'',cat:pre.cat||'',note:pre.note||'',extra:false,
    date:pre.date||(ui.month===todayStr().slice(0,7)?todayStr():ui.month+'-01')};
  ui.draft={id:id||null};
  var cats=cur.type==='income'?INC:EXP;
  if(cats.indexOf(cur.cat)<0)cur.cat=cats[0];
  openSheet('<div class="sh"><h2>'+(t?'編輯這筆':'記一筆')+'</h2><button class="ghost" data-a="closeSheet">關閉</button></div>'+
    '<div class="fld">'+radios('type',['支出','收入'],cur.type==='income'?'收入':'支出')+'</div>'+
    '<label class="fld"><span>金額</span><input type="number" inputmode="decimal" id="t_amt" placeholder="0" value="'+(cur.amount||'')+'"></label>'+
    '<label class="fld"><span>類別</span><select id="t_cat">'+cats.map(function(c){return '<option'+(c===cur.cat?' selected':'')+'>'+c+'</option>';}).join('')+'</select></label>'+
    '<label class="sw" id="t_xw" style="display:'+(cur.type==='income'?'flex':'none')+'"><div>獎金／額外收入<small>會算進「多了錢錢」</small></div><input type="checkbox" id="t_extra"'+(cur.extra?' checked':'')+'></label>'+
    '<label class="fld"><span>日期</span><input type="date" id="t_date" value="'+cur.date+'"></label>'+
    '<label class="fld"><span>備註</span><input type="text" id="t_note" placeholder="買了什麼、誰給的…" value="'+esc(cur.note)+'"></label>'+
    '<div class="btns">'+(t?'<button class="btn danger" data-a="delTx">刪除</button>':'')+'<button class="btn primary" data-a="saveTx">儲存</button></div>');
}

function openSettings(){
  var ym=ui.month,mo=+ym.slice(5);
  openSheet('<div class="sh"><h2>生活費與飯錢</h2><button class="ghost" data-a="closeSheet">關閉</button></div>'+
    '<p class="hint">生活費從'+mo+'月開始沿用，之後的月份都用這個數字，直到你再改。每日飯錢會套用到所有月份。</p>'+
    '<label class="fld"><span>'+mo+'月起每月生活費</span><input type="number" inputmode="decimal" id="s_allow" placeholder="0" value="'+(allowOf(ym)||'')+'"></label>'+
    '<label class="fld"><span>自付一天的飯錢</span><input type="number" inputmode="decimal" id="s_rate" placeholder="400" value="'+(S.rate||400)+'"></label>'+
    '<div class="btns"><button class="btn primary" data-a="saveSettings">儲存</button></div>');
}

function openBackup(){
  openSheet('<div class="sh"><h2>備份與還原</h2><button class="ghost" data-a="closeSheet">關閉</button></div>'+
    '<p class="hint">資料只存在這支手機的瀏覽器裡。換手機或清除資料前，先按「產生備份」，把文字複製起來保存；之後貼回來按「還原」。</p>'+
    '<textarea id="bk" class="in" rows="6" placeholder="備份文字會出現在這裡"></textarea>'+
    '<div class="btns"><button class="btn" data-a="makeBackup">產生備份</button><button class="btn primary" data-a="restore">還原</button></div>');
}

/* ---------- toast ---------- */
var tt;
function toast(msg,label,fn){
  var el=$('#toast');
  el.innerHTML='<span>'+esc(msg)+'</span>'+(label?'<button data-a="toastAct">'+esc(label)+'</button>':'');
  toast.fn=fn||null;
  el.classList.add('show');
  clearTimeout(tt);tt=setTimeout(function(){el.classList.remove('show');},label?5000:2500);
}

/* ---------- actions ---------- */
var A={
  tab:function(el){ui.tab=el.dataset.v;render();window.scrollTo(0,0);},
  cat:function(el){ui.cat=el.dataset.v;render();},
  monthPrev:function(){ui.month=shiftMonth(ui.month,-1);render();},
  monthNext:function(){ui.month=shiftMonth(ui.month,1);render();},
  closeSheet:closeSheet,
  addItem:function(){openItem(null);},
  editItem:function(el){openItem(el.dataset.id);},
  rmPhoto:function(){ui.draft.photo='';$('#pv').innerHTML=photoPrev('');},
  saveItem:function(){
    var name=$('#f_name').value.trim();
    if(!name){toast('請輸入名稱');return;}
    var data={name:name,cat:document.querySelector('#sheet [name=cat]:checked').value,
      price:parseFloat($('#f_price').value)||0,link:normLink($('#f_link').value),note:$('#f_note').value.trim(),photo:ui.draft.photo};
    if(ui.draft.id){Object.assign(S.items.find(function(i){return i.id===ui.draft.id;}),data);}
    else{data.id=uid();data.bought=false;data.created=Date.now();S.items.push(data);}
    if(save()){closeSheet();render();}
  },
  delItem:function(){
    S.items=S.items.filter(function(i){return i.id!==ui.draft.id;});
    save();closeSheet();render();
  },
  toggleBought:function(el){
    var it=S.items.find(function(i){return i.id===el.dataset.id;});
    it.bought=!it.bought;save();render();
    if(it.bought)toast('已標記為買到了','記入支出',function(){
      ui.tab='money';ui.month=todayStr().slice(0,7);render();
      openTx(null,{type:'expense',amount:it.price||'',cat:'購物',note:it.name});
    });
  },
  addTx:function(){openTx(null);},
  addTxDay:function(el){openTx(null,{date:el.dataset.d,cat:'飲食'});},
  editTx:function(el){openTx(el.dataset.id);},
  saveTx:function(){
    var amt=parseFloat($('#t_amt').value);
    if(!(amt>0)){toast('請輸入金額');return;}
    var date=$('#t_date').value||todayStr();
    var isInc=document.querySelector('#sheet [name=type]:checked').value==='收入';
    var data={type:isInc?'income':'expense',amount:amt,cat:$('#t_cat').value,extra:isInc&&$('#t_extra').checked,date:date,note:$('#t_note').value.trim()};
    if(ui.draft.id){Object.assign(S.tx.find(function(x){return x.id===ui.draft.id;}),data);}
    else{data.id=uid();S.tx.push(data);}
    ui.month=date.slice(0,7);
    if(save()){closeSheet();rerender();}
  },
  delTx:function(){S.tx=S.tx.filter(function(x){return x.id!==ui.draft.id;});save();closeSheet();rerender();},
  weekAll:function(el){
    var w=+el.dataset.w,ym=ui.month,dim=dimOf(ym),s=(w-1)*7+1,e=w===5?dim:Math.min(w*7,dim),d,all=true;
    for(d=s;d<=e;d++)if(!S.pay[ym+'-'+pad(d)])all=false;
    for(d=s;d<=e;d++){var k=ym+'-'+pad(d);if(all)delete S.pay[k];else S.pay[k]=1;}
    save();rerender();
  },
  openSettings:openSettings,
  saveSettings:function(){
    var a=parseFloat($('#s_allow').value)||0,r=parseFloat($('#s_rate').value)||400;
    S.allow[ui.month]=a;S.rate=r;
    if(save()){closeSheet();rerender();}
  },
  openBackup:openBackup,
  makeBackup:function(){
    var ta=$('#bk');ta.value=JSON.stringify(S);ta.focus();ta.select();
    try{navigator.clipboard.writeText(ta.value).then(function(){toast('已複製備份');},function(){});}catch(e){}
  },
  restore:function(){
    try{
      var d=JSON.parse($('#bk').value);
      if(!d||!Array.isArray(d.items)||!Array.isArray(d.tx))throw 0;
      S={items:d.items,tx:d.tx,pay:d.pay||{},allow:d.allow||{},rate:d.rate||400};
      S.tx.forEach(function(t){if(MIGRATE[t.cat])t.cat=MIGRATE[t.cat];});
      if(save()){closeSheet();render();toast('已還原');}
    }catch(e){toast('備份格式不正確');}
  },
  toastAct:function(){$('#toast').classList.remove('show');if(toast.fn)toast.fn();}
};

document.addEventListener('click',function(e){
  if(e.target.closest('a'))return;
  var el=e.target.closest('[data-a]');
  if(!el)return;
  var f=A[el.dataset.a];
  if(f)f(el,e);
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.classList&&t.classList.contains('paybox')){
    if(t.checked)S.pay[t.dataset.d]=1;else delete S.pay[t.dataset.d];
    save();rerender();return;
  }
  if(t.id==='photoIn'&&t.files&&t.files[0]){
    readPhoto(t.files[0]).then(function(p){ui.draft.photo=p;$('#pv').innerHTML=photoPrev(p);},function(){toast('這張照片讀不出來');});
  }
  if(t.name==='type'){
    var inc=t.value==='收入',list=inc?INC:EXP;
    $('#t_cat').innerHTML=list.map(function(c){return '<option>'+c+'</option>';}).join('');
    $('#t_xw').style.display=inc?'flex':'none';
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet();});

render();
})();
</script>
<script>
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
</script>
